<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Carousel</title>
  <style>

    .carousel-wrapper {
      max-width: 1000px;
      margin: 0 auto;
      position: relative;
      perspective: 1500px;
    }

    .carousel {
      height: 460px;
      position: relative;
      overflow: hidden;
    }

    .book-item {
      position: absolute;
      width: 190px;
      top: 50%;
      transform: translateY(-50%);
      transition: all 0.7s cubic-bezier(0.25, 0.1, 0.25, 1);
      cursor: pointer;
      box-shadow: 0 15px 30px rgba(0,0,0,0.35);
      border-radius: 12px;
      overflow: hidden;
    }

    .book-item img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Center - Big & Sharp */
    .book-item.center {
      left: 50%;
      transform: translate(-50%, -50%) scale(1.28);
      z-index: 15;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
    }

    /* Left side */
    .book-item.left {
      left: 25%;
      transform: translateY(-50%) scale(0.78) rotateY(12deg);
      opacity: 0.75;
      filter: blur(1.5px) brightness(0.9);
      z-index: 5;
    }

    /* Right side */
    .book-item.right {
      left: 65%;
      transform: translateY(-50%) scale(0.78) rotateY(-12deg);
      opacity: 0.75;
      filter: blur(1.5px) brightness(0.9);
      z-index: 5;
    }

    /* Even further items (if you have more books) */
    .book-item.far-left, .book-item.far-right {
      opacity: 0.4;
      filter: blur(3px) brightness(0.7);
      z-index: 1;
    }

    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.95);
      border: none;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      font-size: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(0,0,0,0.25);
      z-index: 30;
      transition: all 0.3s;
    }

    .arrow:hover {
      background: white;
      transform: translateY(-50%) scale(1.1);
    }

    .arrow-left  { left: 30px; }
    .arrow-right { right: 30px; }
  </style>
</head>
<body>

  <div class="carousel-wrapper">
    <div class="carousel" id="carousel"></div>

    <button class="arrow arrow-left" id="prev">←</button>
    <button class="arrow arrow-right" id="next">→</button>
  </div>

  <!-- Example anchor target -->
  <div id="book-details" style="margin-top: 100px; padding: 40px; background: #fff; max-width: 800px; margin-left: auto; margin-right: auto;">
    <h2>Book Details Appear Here</h2>
    <p>Content for the selected book...</p>
  </div>

  <script>
    const books = [
      { id: 1, title: "Old Age in Early Medieval England",   img: "https://i0.wp.com/thijsporck.com/wp-content/uploads/2022/01/thijs-porck-old-age-in-early-medieval-england.jpg", anchor: "#book-details" },
      { id: 2, title: "Cultural Connections between the Continent and Early Medieval England",   img: "https://i0.wp.com/thijsporck.com/wp-content/uploads/2025/02/bremmerschrift-cover-2.jpg", anchor: "#book-details" },
      { id: 3, title: "Unlocking the History of English", img: "https://i0.wp.com/thijsporck.com/wp-content/uploads/2024/02/cilt364.jpg", anchor: "#book-details" },
      { id: 4, title: "Keys to the History of English",  img: "https://i0.wp.com/thijsporck.com/wp-content/uploads/2024/02/cilt363.jpg", anchor: "#book-details" },
      { id: 5, title: "Old English Medievalism",  img: "https://i0.wp.com/thijsporck.com/wp-content/uploads/2022/06/oemedievalism-coverrrrrrrrrr.jpg", anchor: "#book-details" },
    ];

    let currentIndex = 1; // Start with middle book centered

        const carousel = document.getElementById('carousel');

    function renderCarousel() {
      carousel.innerHTML = '';

      books.forEach((book, i) => {
        const item = document.createElement('div');
        item.className = 'book-item';

        const diff = i - currentIndex;

        if (diff === 0) item.classList.add('center');
        else if (diff === -1) item.classList.add('left');
        else if (diff === 1) item.classList.add('right');
        else if (diff < -1) item.classList.add('far-left');
        else if (diff > 1) item.classList.add('far-right');

        item.innerHTML = `<img src="${book.img}" alt="${book.title}">`;

        // Only center is clickable
        if (diff === 0) {
          item.style.cursor = 'pointer';
          item.addEventListener('click', () => {
            window.location.href = book.anchor;
          });
        }

        carousel.appendChild(item);
      });
    }

    function moveCarousel(direction) {
      currentIndex = (currentIndex + direction + books.length) % books.length;
      renderCarousel();
    }

    document.getElementById('prev').addEventListener('click', () => moveCarousel(-1));
    document.getElementById('next').addEventListener('click', () => moveCarousel(1));

    // Keyboard arrows
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') moveCarousel(-1);
      if (e.key === 'ArrowRight') moveCarousel(1);
    });

    // Initial render
    renderCarousel();
  </script>
</body>
</html>
