<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Carousel - 5 Visible</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f8f9fa;
      margin: 0;
      padding: 60px 0;
    }

    .carousel-wrapper {
      max-width: 1100px;
      margin: 0 auto;
      position: relative;
      perspective: 1600px;
    }

    .carousel {
      height: 480px;
      position: relative;
      overflow: hidden;
    }

    .book-item {
      position: absolute;
      width: 200px;
      top: 50%;
      transform: translateY(-50%);
      transition: all 0.8s cubic-bezier(0.23, 1, 0.32, 1);
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
      border-radius: 12px;
      overflow: hidden;
    }

    .book-item img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Far Left (-2) - 40% */
    .book-item.offset-2 {
      left: 8%;
      transform: translateY(-50%) scale(0.42);
      opacity: 0.45;
      filter: blur(4px) brightness(0.85);
      z-index: 1;
    }

    /* Near Left (-1) - 70% */
    .book-item.offset-1 {
      left: 22%;
      transform: translateY(-50%) scale(0.72) rotateY(8deg);
      opacity: 0.78;
      filter: blur(1.5px) brightness(0.95);
      z-index: 5;
    }

    /* Center (0) */
    .book-item.offset-0 {
      left: 50%;
      transform: translate(-50%, -50%) scale(1.25);
      box-shadow: 0 30px 60px rgba(0,0,0,0.45);
      z-index: 20;
    }

    /* Near Right (+1) - 70% */
    .book-item.offset-1r {
      left: 68%;
      transform: translateY(-50%) scale(0.72) rotateY(-8deg);
      opacity: 0.78;
      filter: blur(1.5px) brightness(0.95);
      z-index: 5;
    }

    /* Far Right (+2) - 40% */
    .book-item.offset-2r {
      left: 82%;
      transform: translateY(-50%) scale(0.42);
      opacity: 0.45;
      filter: blur(4px) brightness(0.85);
      z-index: 1;
    }

    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.95);
      border: none;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      font-size: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
      z-index: 30;
    }

    .arrow:hover { transform: translateY(-50%) scale(1.12); }
    .arrow-left  { left: 20px; }
    .arrow-right { right: 20px; }
  </style>
</head>
<body>

  <div class="carousel-wrapper">
    <div class="carousel" id="carousel"></div>
    <button class="arrow arrow-left" id="prev">←</button>
    <button class="arrow arrow-right" id="next">→</button>
  </div>
<!-- Example anchor target -->
  <div id="book-details" style="margin-top: 100px; padding: 40px; background: #fff; max-width: 800px; margin-left: auto; margin-right: auto;">
    <h2>Book Details Appear Here</h2>
    <p>Content for the selected book...</p>
  </div>

  <script>
    const books = [
      { id: 1, title: "Old Age in Early Medieval England",   img: "https://i0.wp.com/thijsporck.com/wp-content/uploads/2022/01/thijs-porck-old-age-in-early-medieval-england.jpg", anchor: "#book-details" },
      { id: 2, title: "Cultural Connections between the Continent and Early Medieval England",   img: "https://i0.wp.com/thijsporck.com/wp-content/uploads/2025/02/bremmerschrift-cover-2.jpg", anchor: "#book-details" },
      { id: 3, title: "Unlocking the History of English", img: "https://i0.wp.com/thijsporck.com/wp-content/uploads/2024/02/cilt364.jpg", anchor: "#book-details" },
      { id: 4, title: "Keys to the History of English",  img: "https://i0.wp.com/thijsporck.com/wp-content/uploads/2024/02/cilt363.jpg", anchor: "#book-details" },
      { id: 5, title: "Old English Medievalism",  img: "https://i0.wp.com/thijsporck.com/wp-content/uploads/2022/06/oemedievalism-coverrrrrrrrrr.jpg", anchor: "#book-details" },
      { id: 6, title: "Early Medieval English Life Courses",   img: "https://i0.wp.com/thijsporck.com/wp-content/uploads/2022/01/openacces.cover-emelc.jpg", anchor: "#book-details" },
      { id: 7, title: "Exploring Early Medieval English Eloquence",   img: "https://i0.wp.com/thijsporck.com/wp-content/uploads/2022/01/eemee.publicatiepagina.coverpagina.jpg", anchor: "#book-details" },
      { id: 8, title: "Scholarly Correspondence on Medieval Germanic Language and Literature", img: "https://i0.wp.com/thijsporck.com/wp-content/uploads/2022/01/porckvanbaalenmann.2018.abag2018.cover_.jpg", anchor: "#book-details" },
      { id: 9, title: "The Familiar and the Foreign in Old Germanic Studies",  img: "https://i0.wp.com/thijsporck.com/wp-content/uploads/2022/01/porckfamiliarforeign-cover.jpg", anchor: "#book-details" },
      { id: 10, title: "Tracing Paradigms: One Hundred Years of Neophilologus",  img: "https://i0.wp.com/thijsporck.com/wp-content/uploads/2022/01/9783319815534-920x960-1.jpg", anchor: "#book-details" },
    ];

    let currentIndex = 0;   // Starts with first book

    const carousel = document.getElementById('carousel');

    function renderCarousel() {
      carousel.innerHTML = '';

      for (let i = -2; i <= 2; i++) {
        const bookIndex = (currentIndex + i + books.length) % books.length;
        const book = books[bookIndex];

        const item = document.createElement('div');
        item.className = 'book-item';

        if (i === 0) {
          item.classList.add('offset-0');
        } else if (i === -1) {
          item.classList.add('offset-1');
        } else if (i === -2) {
          item.classList.add('offset-2');
        } else if (i === 1) {
          item.classList.add('offset-1r');
        } else if (i === 2) {
          item.classList.add('offset-2r');
        }

        item.innerHTML = `<img src="${book.img}" alt="${book.title}">`;

        // Only center is clickable
        if (i === 0) {
          item.style.cursor = 'pointer';
          item.addEventListener('click', () => {
            window.location.href = book.anchor;
          });
        }

        carousel.appendChild(item);
      }
    }

    function moveCarousel(direction) {
      currentIndex = (currentIndex + direction + books.length) % books.length;
      renderCarousel();
    }

    document.getElementById('prev').addEventListener('click', () => moveCarousel(-1));
    document.getElementById('next').addEventListener('click', () => moveCarousel(1));

    // Keyboard support
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') moveCarousel(-1);
      if (e.key === 'ArrowRight') moveCarousel(1);
    });

    renderCarousel();
  </script>
</body>
</html>
