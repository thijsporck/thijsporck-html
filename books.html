<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Carousel - Fixed</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f8f7f4;
      margin: 0;
      padding: 0;
    }

    .carousel-wrapper {
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      padding: 0 60px; 
    }

    .carousel {
      height: 560px;  
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      gap: 30px;
    }

    .book-item {
      flex-shrink: 0;
      width: 200px;
      transition: all 0.8s cubic-bezier(0.23, 1, 0.32, 1);
      box-shadow: 0 5px 10px rgba(0,0,0,0.3);
      border-radius: 4px;
      position: relative;
    }

    .book-item img {
      width: 100%;
      height: auto;
      display: block;
    }

    .book-title {
      position: absolute;
      bottom: -55px;
      left: 50%;
      transform: translateX(-50%);
      background: #fff;
      color: #222;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 0.8 rem;
      font-weight: 600;
      white-space: nowrap;
      box-shadow: 0 3px 8px rgba(0,0,0,0.2);
      z-index: 30;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .book-item.center .book-title {
      opacity: 1;
    }

    .book-item.center {
      transform: scale(1.28);
      z-index: 20;
      box-shadow: 0 30px 60px rgba(0,0,0,0.45);
    }

    .book-item.left, .book-item.right {
      transform: scale(0.8) rotateY(8deg);
      opacity: 0.78;
      filter: blur(1.5px) brightness(0.95);
      z-index: 1;
    }

    .book-item.right {
      transform: scale(0.8) rotateY(-8deg);
    }

    .book-item.far-left, .book-item.far-right {
      transform: scale(0.5);
      opacity: 0.45;
      filter: blur(4px) brightness(0.85);
      z-index: 5;
    }

    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.95);
      border: none;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      font-size: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
      z-index: 40;
    }

    .arrow-left  { left: 0; }
    .arrow-right { right: 0; }

    .arrow:hover { transform: translateY(-50%) scale(1.12); }
  </style>
</head>
<body>
        <h1>Books</h1>

  <div class="carousel-wrapper">
    <div class="carousel" id="carousel"></div>
    <button class="arrow arrow-left" id="prev">←</button>
    <button class="arrow arrow-right" id="next">→</button>
  </div>

  <script>
    const books = [
      { id: 1, title: "<i>Old Age in Early Medieval England</I> (2019)",   img: "https://i0.wp.com/thijsporck.com/wp-content/uploads/2022/01/thijs-porck-old-age-in-early-medieval-england.jpg", anchor: "https://thijsporck.com/books/#oldage" },
      { id: 2, title: "Cultural Connections between the Continent and Early Medieval England",   img: "https://i0.wp.com/thijsporck.com/wp-content/uploads/2025/02/bremmerschrift-cover-2.jpg", anchor: "#book-details" },
      { id: 3, title: "Unlocking the History of English", img: "https://i0.wp.com/thijsporck.com/wp-content/uploads/2024/02/cilt364.jpg", anchor: "#book-details" },
      { id: 4, title: "Keys to the History of English",  img: "https://i0.wp.com/thijsporck.com/wp-content/uploads/2024/02/cilt363.jpg", anchor: "#book-details" },
      { id: 5, title: "Old English Medievalism",  img: "https://i0.wp.com/thijsporck.com/wp-content/uploads/2022/06/oemedievalism-coverrrrrrrrrr.jpg", anchor: "#book-details" },
      { id: 6, title: "Early Medieval English Life Courses",   img: "https://i0.wp.com/thijsporck.com/wp-content/uploads/2022/01/openacces.cover-emelc.jpg", anchor: "#book-details" },
      { id: 7, title: "Exploring Early Medieval English Eloquence",   img: "https://i0.wp.com/thijsporck.com/wp-content/uploads/2022/01/eemee.publicatiepagina.coverpagina.jpg", anchor: "#book-details" },
      { id: 8, title: "Scholarly Correspondence on Medieval Germanic Language and Literature", img: "https://i0.wp.com/thijsporck.com/wp-content/uploads/2022/01/porckvanbaalenmann.2018.abag2018.cover_.jpg", anchor: "#book-details" },
      { id: 9, title: "The Familiar and the Foreign in Old Germanic Studies",  img: "https://i0.wp.com/thijsporck.com/wp-content/uploads/2022/01/porckfamiliarforeign-cover.jpg", anchor: "#book-details" },
      { id: 10, title: "Tracing Paradigms: One Hundred Years of Neophilologus",  img: "https://i0.wp.com/thijsporck.com/wp-content/uploads/2022/01/9783319815534-920x960-1.jpg", anchor: "#book-details" },
    ];


    let currentIndex = 0;

    const carousel = document.getElementById('carousel');

    function renderCarousel() {
      carousel.innerHTML = '';

      for (let i = -2; i <= 2; i++) {
        const bookIndex = (currentIndex + i + books.length) % books.length;
        const book = books[bookIndex];

        const item = document.createElement('div');
        
        let className = 'book-item ';
        if (i === 0) className += 'center';
        else if (i === -2) className += 'far-left';
        else if (i === -1) className += 'left';
        else if (i === 1) className += 'right';
        else if (i === 2) className += 'far-right';

        item.className = className;

        item.innerHTML = `
          <img src="${book.img}" alt="${book.title}">
          ${i === 0 ? `<div class="book-title">${book.title}</div>` : ''}
        `;

        if (i === 0) {
          item.style.cursor = 'pointer';
          item.addEventListener('click', () => window.location.href = book.anchor);
        }

        carousel.appendChild(item);
      }
    }

    function moveCarousel(direction) {
      currentIndex = (currentIndex + direction + books.length) % books.length;
      renderCarousel();
    }

    document.getElementById('prev').addEventListener('click', () => moveCarousel(-1));
    document.getElementById('next').addEventListener('click', () => moveCarousel(1));

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') moveCarousel(-1);
      if (e.key === 'ArrowRight') moveCarousel(1);
    });

    renderCarousel();
  </script>
</body>
</html>
